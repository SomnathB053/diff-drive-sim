slam_toolbox:
  ros__parameters:
    # Essential Frames & Topics
    use_sim_time: true
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    mode: mapping

    # Core Robustness Fixes
    ceres_loss_function: HuberLoss
    min_laser_range: 0.15
    max_laser_range: 8.5
    transform_timeout: 0.5
